<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baymax - Learn. Build. Grow. Join the Community</title>
    <meta name="description" content="A community for learners, builders and dreamers who are here to learn, build, and grow together with Baymax.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Scroll Reading Progress Indicator -->
    <div id="scroll-progress" class="scroll-progress"></div>

    <!-- Floating Navigation Bar / Header -->
    <header class="floating-header" id="navbar">
        <div class="nav-container">
            <a href="#section-1" class="brand-logo">
                <span class="logo-text">Baymax<span class="dot">.</span></span>
            </a>
            <div class="nav-links">
                <a href="#section-1" class="nav-item active">Home</a>
                <a href="#section-2" class="nav-item">Coding Journey</a>
                <a href="#section-3" class="nav-item">What We Do</a>
                <a href="#section-4" class="nav-item">Join Us</a>
            </div>
        </div>
    </header>

    <!-- Main Container Stacked Vertically -->
    <main class="sections-wrapper">

        <!-- Section 1: Hero / Welcome -->
        <section id="section-1" class="image-section fade-in-section">
            <div class="image-container">
                <picture>
                    <source srcset="images/section1.webp" type="image/webp">
                    <img src="images/section1.jpg" alt="Welcome to Baymax. Learn. Build. Grow. Join the Community" class="responsive-img" loading="eager" width="1024" height="560">
                </picture>
                
                <!-- Clickable Hotspots -->
                <!-- Top Right: Join Community Button -->
                <a href="https://forms.gle/pgsRtchLe53S1yRf7" class="hotspot hotspot-top-right-red js-google-form-link" 
                   aria-label="Join Community on Google Form" 
                   style="top: 1.5%; left: 76%; width: 21%; height: 9%; border-radius: 30px;"
                   target="_blank" rel="noopener noreferrer">
                   <span class="hotspot-tooltip">Join Community</span>
                </a>
                
                <!-- Bottom Left: Join Baymax Button -->
                <a href="https://forms.gle/pgsRtchLe53S1yRf7" class="hotspot hotspot-bottom-left-blue js-google-form-link" 
                   aria-label="Join Baymax on Google Form" 
                   style="top: 88%; left: 4%; width: 21%; height: 9.5%; border-radius: 30px;"
                   target="_blank" rel="noopener noreferrer">
                   <span class="hotspot-tooltip">Join Baymax</span>
                </a>
            </div>
        </section>

        <!-- Section 2: Rating Journey -->
        <section id="section-2" class="image-section fade-in-section">
            <div class="image-container">
                <picture>
                    <source srcset="images/section2.webp" type="image/webp">
                    <img src="images/section2.jpg" alt="On a scale of 1 to 10, how would you rate your coding journey? If your answer isn't 10... let's improve it together." class="responsive-img" loading="lazy" width="1024" height="576">
                </picture>
                
                <!-- Clickable Hotspots -->
                <!-- Top Right: Join Baymax Button -->
                <a href="https://forms.gle/pgsRtchLe53S1yRf7" class="hotspot hotspot-top-right-red js-google-form-link" 
                   aria-label="Join Baymax on Google Form" 
                   style="top: 1.5%; left: 82%; width: 17%; height: 8%; border-radius: 30px;"
                   target="_blank" rel="noopener noreferrer">
                   <span class="hotspot-tooltip">Join Baymax</span>
                </a>

                <!-- Bottom Right: Improve Together Button -->
                <a href="https://forms.gle/pgsRtchLe53S1yRf7" class="hotspot hotspot-bottom-right-red js-google-form-link" 
                   aria-label="Improve Together on Google Form" 
                   style="top: 84%; left: 67%; width: 20%; height: 9%; border-radius: 30px;"
                   target="_blank" rel="noopener noreferrer">
                   <span class="hotspot-tooltip">Improve Together</span>
                </a>
            </div>
        </section>

        <!-- Section 3: What We'll Do Together -->
        <section id="section-3" class="image-section fade-in-section">
            <div class="image-container">
                <picture>
                    <source srcset="images/section3.webp" type="image/webp">
                    <img src="images/section3.png" alt="What we'll do together: Build real projects, Share resources, Keep everything free, Participating in Hackathons" class="responsive-img" loading="lazy" width="1024" height="341">
                </picture>
            </div>
        </section>

        <!-- Section 4: Interested in Joining? -->
        <section id="section-4" class="image-section fade-in-section">
            <div class="image-container">
                <picture>
                    <source srcset="images/section4.webp" type="image/webp">
                    <img src="images/section4.png" alt="Interested in joining? Fill the Google Form or DM me directly. One community. Many minds. Infinite possibilities." class="responsive-img" loading="lazy" width="1024" height="369">
                </picture>

                <!-- Clickable Hotspot -->
                <!-- Center: Fill the Google Form Button -->
                <a href="https://forms.gle/pgsRtchLe53S1yRf7" class="hotspot hotspot-center-red js-google-form-link" 
                   aria-label="Fill the Google Form" 
                   style="top: 52%; left: 37%; width: 26%; height: 14%; border-radius: 30px;"
                   target="_blank" rel="noopener noreferrer">
                   <span class="hotspot-tooltip">Fill Google Form</span>
                </a>
            </div>
        </section>

    </main>

    <!-- Scroll to top floating button -->
    <button id="back-to-top" class="back-to-top" aria-label="Scroll to Top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
